<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Weave</title>
  <defs>
    <linearGradient id="weave-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a93ea"/>
      <stop offset="1" stop-color="#2f7fe0"/>
    </linearGradient>
    <linearGradient id="weave-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a33c"/>
      <stop offset="1" stop-color="#e0457b"/>
    </linearGradient>
  </defs>
  <style>
    /* 다크 탭바에서 파랑이 묻히지 않게 한 단계 밝힌다 */
    @media (prefers-color-scheme: dark) {
      #weave-sky stop:first-child { stop-color: #7bb8f5; }
      #weave-sky stop:last-child  { stop-color: #5aa3f0; }
    }
  </style>
  <circle cx="24" cy="9.5" r="4.6" fill="url(#weave-sun)"/>
  <path d="M7 19.5 15.5 37 24 24.5 32.5 37 41 19.5" fill="none" stroke="url(#weave-sky)"
        stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
